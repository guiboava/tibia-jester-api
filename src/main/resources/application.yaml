spring:
  main:
    banner-mode: "off"
  application:
    name: tibia-jester-api
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:postgresql://localhost:5432/tibia-jester-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
  server:
    address: 0.0.0.0
    port: 8080
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
logging:
  pattern:
    console: '%clr(%d{dd-MM-yyyy HH:mm:ss}){faint} %clr(%5p) %clr([%t]){faint} %clr(%-40.40logger){cyan} %clr(:){yellow} %m%n'
  file:
    name: tibia-jester.log
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.security.web.access: INFO
    org.springframework.security.web.authentication: INFO
    org.springframework.security.web.savedrequest: INFO
    io.github.guiboava.tibia-jester-api: DEBUG
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
info:
  app:
    name: Tibia Jester API
    description: API para ferramentas e recursos de Tibia
    version: 1.0.0